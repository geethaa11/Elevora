name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Verify email-validator
        run: |
          python -c "import email_validator; print('email-validator OK')"

      - name: Verify backend import
        env:
          SECRET_KEY: github-actions-test-secret
          DATABASE_URL: sqlite:///./test.db
        run: |
          python -c "from backend.main import app; print('Backend import successful')"

      - name: Compile Python files
        run: |
          python -m compileall backend